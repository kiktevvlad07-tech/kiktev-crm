<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiktev CRM</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff}
header{padding:18px;background:#111827;border-bottom:2px solid #d4af37}
h1{color:#d4af37;font-size:26px}
.wrapper{padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#1e293b;padding:16px;border-radius:14px;border:1px solid #334155}
.stat b{font-size:24px;color:#d4af37}
.attention{background:#1e293b;border:2px solid #ef4444;border-radius:16px;padding:14px;margin-bottom:16px}
.attention h2{color:#ef4444;margin-bottom:10px}
.attention-card{background:#111827;border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button{background:#d4af37;color:#000;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:0;margin-top:6px;margin-bottom:10px}
.search{max-width:420px}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:20px}
.column{min-width:280px;background:#111827;border-radius:16px;padding:12px;border:1px solid #334155}
.column h3{margin-bottom:12px;color:#d4af37}
.card{background:#1e293b;border-radius:14px;padding:12px;margin-bottom:10px;border-left:5px solid #d4af37;cursor:pointer}
.card small{color:#94a3b8}
.tag{display:inline-block;background:#334155;border-radius:999px;padding:4px 8px;font-size:12px;margin-top:6px;margin-right:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-box{background:#0f172a;border:2px solid #d4af37;border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.history{background:#111827;padding:12px;border-radius:12px;margin-top:10px}
.danger{background:#7f1d1d;color:#fff}
.gray{background:#334155;color:#fff}
.quick{background:#14532d;color:#fff}
</style>
</head>

<body>

<header>
<h1>🏠 Kiktev CRM</h1>
<div>Личная CRM для клиентов по недвижимости</div>
</header>

<div class="wrapper">

<div class="stats">
<div class="stat">🔴 Просрочено<br><b id="overdueCount">0</b></div>
<div class="stat">🟡 Сегодня<br><b id="todayCount">0</b></div>
<div class="stat">🟢 Завтра<br><b id="tomorrowCount">0</b></div>
<div class="stat">👥 Всего клиентов<br><b id="totalCount">0</b></div>
</div>

<div class="attention">
<h2>🔥 Требуют внимания</h2>
<div id="attentionList"></div>
</div>

<div class="actions">
<button onclick="openNewClient()">+ Новый клиент</button>
<button class="gray" onclick="loadClients()">🔄 Обновить</button>
<input class="search" id="searchInput" placeholder="Поиск по имени или телефону" oninput="render()">
</div>

<div class="board" id="board"></div>

</div>

<div class="modal" id="clientModal">
<div class="modal-box">
<h2 id="modalTitle">Новый клиент</h2>

<div class="actions" id="quickButtons"></div>

<div class="grid">
<div><label>Имя</label><input id="name"></div>
<div><label>Телефон</label><input id="phone"></div>

<div>
<label>Источник</label>
<select id="source">
<option>Звонок</option><option>Instagram</option><option>MAX</option>
<option>Telegram</option><option>WhatsApp</option><option>Авито</option>
<option>Сайт</option><option>Рекомендация</option><option>Реклама</option><option>Другое</option>
</select>
</div>

<div><label>Подробный источник</label><input id="sourceDetail"></div>

<div>
<label>Статус</label>
<select id="status">
<option>Новый лид</option>
<option>Связался</option>
<option>Подбор</option>
<option>Отправлены варианты</option>
<option>Показ</option>
<option>Бронь</option>
<option>Потерян</option>
<option>Архив сделок</option>
</select>
</div>

<div>
<label>Тип клиента</label>
<select id="clientType">
<option>Покупатель</option><option>Продавец</option><option>Инвестор</option><option>Агент</option>
</select>
</div>

<div>
<label>Что ищет</label>
<select id="requestType">
<option>Новостройка</option>
<option>Вторичное жильё</option>
<option>Дом</option>
<option>Дом от собственника</option>
<option>Коммерческое помещение</option>
<option>Апартаменты</option>
<option>Земля</option>
<option>Продажа объекта</option>
</select>
</div>

<div>
<label>Город</label>
<select id="city">
<option>Краснодар</option><option>Адыгея</option><option>Сочи</option><option>Анапа</option>
<option>Новороссийск</option><option>Горячий Ключ</option><option>Город не знает</option><option>Другое</option>
</select>
</div>

<div>
<label>Район</label>
<select id="district">
<option>Любимово</option><option>Западный обход</option><option>Губернский</option>
<option>Энка</option><option>Молодёжный</option><option>Немецкая деревня</option>
<option>Район не имеет значения</option><option>Не знает район</option><option>Другое</option>
</select>
</div>

<div><label>Бюджет до</label><input id="budget"></div>
<div><label>Первый взнос</label><input id="firstPay"></div>
<div><label>Комфортный платёж</label><input id="monthPay"></div>

<div>
<label>Условия покупки</label>
<select id="dealType">
<option>Семейная до 7 лет</option><option>Семейная 2 детей</option><option>Маткапитал</option>
<option>IT ипотека</option><option>Военная ипотека</option><option>Рассрочка</option>
<option>Наличные</option><option>Стандартная ипотека</option><option>Не знает</option>
</select>
</div>

<div>
<label>Метка</label>
<select id="tag">
<option>Горячий</option><option>Тёплый</option><option>Холодный</option>
<option>Агент</option><option>Проблемный</option><option>Не работать</option><option>VIP</option>
</select>
</div>

<div>
<label>Следующее действие</label>
<select id="nextAction">
<option>Перезвонить</option><option>Отправить подборку</option><option>Встреча</option>
<option>Показ</option><option>Узнать решение</option><option>Другое</option>
</select>
</div>

<div><label>Дата напоминания</label><input type="date" id="reminderDate"></div>
</div>

<label>Причина следующего контакта</label>
<input id="nextReason">

<label>Быстрая заметка</label>
<textarea id="note" rows="3"></textarea>

<label>История / комментарий</label>
<textarea id="historyText" rows="3"></textarea>

<div class="actions">
<button onclick="saveClient()">Сохранить</button>
<button class="gray" onclick="addHistory()">+ Добавить историю</button>
<button class="quick" onclick="quickHistory('Перезвонил клиенту')">📞 Перезвонил</button>
<button class="quick" onclick="quickHistory('Отправил подборку')">📨 Отправил подборку</button>
<button class="quick" onclick="quickHistory('Провёл показ')">🏠 Показ</button>
<button class="danger" onclick="deleteClient()">Удалить</button>
<button class="gray" onclick="closeModal()">Закрыть</button>
</div>

<div class="history">
<h3>История клиента</h3>
<div id="historyList"></div>
</div>

</div>
</div>

<script>
const SUPABASE_URL = "https://ttbmhckceewudggcgvdp.supabase.co";
const SUPABASE_KEY = "sb_publishable_NvSnbdCRzJ8-yBwyDivZlA_8wahQP04";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statuses = ["Новый лид","Связался","Подбор","Отправлены варианты","Показ","Бронь","Потерян","Архив сделок"];
let clients = [];
let currentId = null;

function cleanPhone(phone){
return (phone || "").replace(/\D/g,"");
}

function todayStr(offset=0){
const d = new Date();
d.setDate(d.getDate()+offset);
return d.toISOString().split("T")[0];
}

function formatDate(dateStr){
if(!dateStr) return "нет даты";
return dateStr.split("-").reverse().join(".");
}

function mapFromDb(c){
return {
id:c.id,
name:c.name,
phone:c.phone,
source:c.source,
sourceDetail:c.source_detail,
status:c.status,
clientType:c.client_type,
requestType:c.request_type,
city:c.city,
district:c.district,
budget:c.budget,
firstPay:c.first_pay,
monthPay:c.month_pay,
dealType:c.deal_type,
tag:c.tag,
nextAction:c.next_action,
reminderDate:c.reminder_date,
nextReason:c.next_reason,
note:c.note,
history:c.history || [],
createdAt:c.created_at,
updatedAt:c.updated_at
};
}

function mapToDb(c){
return {
name:c.name,
phone:c.phone,
source:c.source,
source_detail:c.sourceDetail,
status:c.status,
client_type:c.clientType,
request_type:c.requestType,
city:c.city,
district:c.district,
budget:c.budget,
first_pay:c.firstPay,
month_pay:c.monthPay,
deal_type:c.dealType,
tag:c.tag,
next_action:c.nextAction,
reminder_date:c.reminderDate || null,
next_reason:c.nextReason,
note:c.note,
history:c.history || []
};
}

async function loadClients(){
const { data, error } = await db
.from("clients")
.select("*")
.order("created_at", { ascending:false });

if(error){
alert("Ошибка загрузки из Supabase: " + error.message);
return;
}

clients = data.map(mapFromDb);
render();
}

function render(){
const board = document.getElementById("board");
const q = document.getElementById("searchInput").value.toLowerCase();
board.innerHTML = "";

statuses.forEach(st=>{
const col = document.createElement("div");
col.className = "column";
col.innerHTML = `<h3>${st}</h3>`;

clients
.filter(c=>c.status===st)
.filter(c=>(String(c.name)+String(c.phone)).toLowerCase().includes(q))
.forEach(c=>{
const card = document.createElement("div");
card.className = "card";
card.onclick = ()=>openClient(c.id);
card.innerHTML = `
<b>${c.name || "Без имени"}</b><br>
<small>📞 ${c.phone || ""}</small><br>
🏠 ${c.requestType || ""}<br>
📍 ${c.district || ""}<br>
💰 ${c.budget || ""}<br>
<small>📅 ${c.nextAction || ""}: ${formatDate(c.reminderDate)}</small><br>
${c.nextReason ? `<small>📝 ${c.nextReason}</small><br>` : ""}
<span class="tag">${c.tag || ""}</span>
<span class="tag">${c.source || ""}</span>
`;
col.appendChild(card);
});

board.appendChild(col);
});

updateStats();
renderAttention();
}

function updateStats(){
const today = todayStr(0);
const tomorrow = todayStr(1);

document.getElementById("totalCount").innerText = clients.length;
document.getElementById("todayCount").innerText = clients.filter(c=>c.reminderDate===today && c.status!=="Архив сделок").length;
document.getElementById("tomorrowCount").innerText = clients.filter(c=>c.reminderDate===tomorrow && c.status!=="Архив сделок").length;
document.getElementById("overdueCount").innerText = clients.filter(c=>c.reminderDate && c.reminderDate<today && c.status!=="Архив сделок" && c.status!=="Потерян").length;
}

function renderAttention(){
const list = document.getElementById("attentionList");
const today = todayStr(0);

const items = clients.filter(c =>
c.reminderDate &&
c.reminderDate <= today &&
c.status !== "Архив сделок" &&
c.status !== "Потерян"
);

if(!items.length){
list.innerHTML = "<small>Сейчас срочных задач нет</small>";
return;
}

list.innerHTML = "";
items.forEach(c=>{
const div = document.createElement("div");
div.className = "attention-card";
div.onclick = ()=>openClient(c.id);
div.innerHTML = `
<b>${c.name || "Без имени"}</b><br>
📞 ${c.phone || ""}<br>
⚠ ${c.nextAction || "Действие"} — ${formatDate(c.reminderDate)}<br>
${c.nextReason ? `📝 ${c.nextReason}` : ""}
`;
list.appendChild(div);
});
}

function openNewClient(){
currentId = null;
document.getElementById("modalTitle").innerText = "Новый клиент";
clearForm();
document.getElementById("clientModal").style.display = "flex";
renderHistory([]);
renderQuickButtons("");
}

function openClient(id){
currentId = id;
const c = clients.find(x=>x.id===id);
document.getElementById("modalTitle").innerText = c.name || "Клиент";

["name","phone","source","sourceDetail","status","clientType","requestType","city","district","budget","firstPay","monthPay","dealType","tag","nextAction","reminderDate","nextReason","note"].forEach(id=>{
document.getElementById(id).value = c[id] || "";
});

document.getElementById("historyText").value = "";
renderHistory(c.history || []);
renderQuickButtons(c.phone || "");
document.getElementById("clientModal").style.display = "flex";
}

function renderQuickButtons(phone){
const box = document.getElementById("quickButtons");
const p = cleanPhone(phone);
if(!p){box.innerHTML="";return;}
box.innerHTML = `
<a href="tel:+${p}"><button>📞 Позвонить</button></a>
<a href="https://wa.me/${p}" target="_blank"><button>💬 WhatsApp</button></a>
`;
}

function clearForm(){
["name","phone","sourceDetail","budget","firstPay","monthPay","reminderDate","nextReason","note","historyText"].forEach(id=>document.getElementById(id).value="");
document.getElementById("status").value="Новый лид";
document.getElementById("source").value="Звонок";
document.getElementById("clientType").value="Покупатель";
document.getElementById("requestType").value="Новостройка";
document.getElementById("city").value="Краснодар";
document.getElementById("district").value="Любимово";
document.getElementById("dealType").value="Семейная до 7 лет";
document.getElementById("tag").value="Горячий";
document.getElementById("nextAction").value="Перезвонить";
}

function collectForm(){
const obj = {};
["name","phone","source","sourceDetail","status","clientType","requestType","city","district","budget","firstPay","monthPay","dealType","tag","nextAction","reminderDate","nextReason","note"].forEach(id=>{
obj[id]=document.getElementById(id).value;
});
return obj;
}

async function saveClient(){
const data = collectForm();
const now = new Date().toLocaleString("ru-RU");
const phone = cleanPhone(data.phone);

if(!currentId && phone){
const activeDuplicate = clients.find(c =>
cleanPhone(c.phone) === phone &&
c.status !== "Архив сделок"
);

if(activeDuplicate){
const openExisting = confirm(
`Клиент с таким номером уже есть в работе:\n\n${activeDuplicate.name}\n${activeDuplicate.phone}\n\nОткрыть карточку?`
);
if(openExisting) openClient(activeDuplicate.id);
return;
}

const archivedClient = clients.find(c =>
cleanPhone(c.phone) === phone &&
c.status === "Архив сделок"
);

if(archivedClient){
const continueCreate = confirm(
`Этот клиент уже есть в архиве сделок:\n\n${archivedClient.name}\n${archivedClient.phone}\n\nМожно создать новую карточку с новым запросом. Создать?`
);
if(!continueCreate) return;
}
}

if(currentId){
const old = clients.find(x=>x.id===currentId);
const oldStatus = old.status;

data.history = old.history || [];

if(oldStatus !== data.status){
data.history.unshift({date:now,text:`Статус изменён: ${oldStatus} → ${data.status}`});
}

data.history.unshift({date:now,text:"Карточка обновлена"});

const { error } = await db
.from("clients")
.update(mapToDb(data))
.eq("id", currentId);

if(error){alert("Ошибка сохранения: " + error.message);return;}

}else{
data.history = [{date:now,text:"Клиент создан"}];

const firstHistory = document.getElementById("historyText").value.trim();
if(firstHistory){
data.history.unshift({date:now,text:firstHistory});
}

const { data: inserted, error } = await db
.from("clients")
.insert(mapToDb(data))
.select()
.single();

if(error){alert("Ошибка создания: " + error.message);return;}

currentId = inserted.id;
}

await loadClients();
openClient(currentId);
}

async function addHistory(){
if(!currentId){await saveClient(); return;}
const text = document.getElementById("historyText").value.trim();
if(!text) return alert("Напиши комментарий в поле истории");

await quickHistory(text);
document.getElementById("historyText").value="";
}

async function quickHistory(text){
if(!currentId){alert("Сначала сохрани клиента"); return;}

const c = clients.find(x=>x.id===currentId);
const now = new Date().toLocaleString("ru-RU");
c.history = c.history || [];
c.history.unshift({date:now,text});

const { error } = await db
.from("clients")
.update({history:c.history})
.eq("id", currentId);

if(error){alert("Ошибка истории: " + error.message);return;}

await loadClients();
openClient(currentId);
}

function renderHistory(history){
const box = document.getElementById("historyList");
box.innerHTML = "";
if(!history.length){box.innerHTML="<small>Истории пока нет</small>";return;}

history.forEach(h=>{
box.innerHTML += `<div style="margin-bottom:10px;border-bottom:1px solid #334155;padding-bottom:8px">
<small>${h.date}</small><br>${h.text}
</div>`;
});
}

async function deleteClient(){
if(!currentId) return closeModal();
if(!confirm("Удалить клиента?")) return;

const { error } = await db.from("clients").delete().eq("id", currentId);
if(error){alert("Ошибка удаления: " + error.message);return;}

closeModal();
await loadClients();
}

function closeModal(){
document.getElementById("clientModal").style.display = "none";
}

loadClients();
</script>

</body>
</html>
