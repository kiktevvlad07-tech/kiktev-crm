<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiktev CRM</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff}
header{padding:18px;background:#111827;border-bottom:2px solid #d4af37}
h1{color:#d4af37;font-size:26px}
.wrapper{padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#1e293b;padding:16px;border-radius:14px;border:1px solid #334155}
.stat b{font-size:24px;color:#d4af37}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button{background:#d4af37;color:#000;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:0;margin-top:6px;margin-bottom:10px}
.search{max-width:420px}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:20px}
.column{min-width:280px;background:#111827;border-radius:16px;padding:12px;border:1px solid #334155}
.column h3{margin-bottom:12px;color:#d4af37}
.card{background:#1e293b;border-radius:14px;padding:12px;margin-bottom:10px;border-left:5px solid #d4af37;cursor:pointer}
.card small{color:#94a3b8}
.tag{display:inline-block;background:#334155;border-radius:999px;padding:4px 8px;font-size:12px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-box{background:#0f172a;border:2px solid #d4af37;border-radius:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.history{background:#111827;padding:12px;border-radius:12px;margin-top:10px}
.danger{background:#7f1d1d;color:#fff}
.gray{background:#334155;color:#fff}
</style>
</head>

<body>

<header>
<h1>🏠 Kiktev CRM</h1>
<div>Личная CRM для клиентов по недвижимости</div>
</header>

<div class="wrapper">

<div class="stats">
<div class="stat">🔴 Просрочено<br><b id="overdueCount">0</b></div>
<div class="stat">🟡 Сегодня<br><b id="todayCount">0</b></div>
<div class="stat">🟢 Завтра<br><b id="tomorrowCount">0</b></div>
<div class="stat">👥 Всего клиентов<br><b id="totalCount">0</b></div>
</div>

<div class="actions">
<button onclick="openNewClient()">+ Новый клиент</button>
<input class="search" id="searchInput" placeholder="Поиск по имени или телефону" oninput="render()">
</div>

<div class="board" id="board"></div>

</div>

<div class="modal" id="clientModal">
<div class="modal-box">
<h2 id="modalTitle">Новый клиент</h2>

<div class="grid">
<div>
<label>Имя</label>
<input id="name">
</div>
<div>
<label>Телефон</label>
<input id="phone">
</div>
<div>
<label>Источник</label>
<select id="source">
<option>Звонок</option>
<option>Instagram</option>
<option>MAX</option>
<option>Telegram</option>
<option>WhatsApp</option>
<option>Авито</option>
<option>Сайт</option>
<option>Рекомендация</option>
<option>Реклама</option>
<option>Другое</option>
</select>
</div>
<div>
<label>Подробный источник</label>
<input id="sourceDetail" placeholder="Reels, Stories, группа MAX...">
</div>
<div>
<label>Статус</label>
<select id="status">
<option>Новый лид</option>
<option>Связался</option>
<option>Подбор</option>
<option>Отправлены варианты</option>
<option>Показ</option>
<option>Бронь</option>
<option>Сделка</option>
<option>Потерян</option>
</select>
</div>
<div>
<label>Тип клиента</label>
<select id="clientType">
<option>Покупатель</option>
<option>Продавец</option>
<option>Инвестор</option>
<option>Агент</option>
</select>
</div>
<div>
<label>Что ищет</label>
<select id="requestType">
<option>Новостройка</option>
<option>Вторичное жильё</option>
<option>Дом</option>
<option>Дом от собственника</option>
<option>Коммерческое помещение</option>
<option>Апартаменты</option>
<option>Земля</option>
<option>Продажа объекта</option>
</select>
</div>
<div>
<label>Город</label>
<select id="city">
<option>Краснодар</option>
<option>Адыгея</option>
<option>Сочи</option>
<option>Анапа</option>
<option>Новороссийск</option>
<option>Горячий Ключ</option>
<option>Город не знает</option>
<option>Другое</option>
</select>
</div>
<div>
<label>Район</label>
<select id="district">
<option>Любимово</option>
<option>Западный обход</option>
<option>Губернский</option>
<option>Энка</option>
<option>Молодёжный</option>
<option>Немецкая деревня</option>
<option>Район не имеет значения</option>
<option>Не знает район</option>
<option>Другое</option>
</select>
</div>
<div>
<label>Бюджет до</label>
<input id="budget" placeholder="например 6 000 000">
</div>
<div>
<label>Первый взнос</label>
<input id="firstPay" placeholder="например 800 000">
</div>
<div>
<label>Комфортный платёж</label>
<input id="monthPay" placeholder="например 35 000">
</div>
<div>
<label>Условия покупки</label>
<select id="dealType">
<option>Семейная до 7 лет</option>
<option>Семейная 2 детей</option>
<option>Маткапитал</option>
<option>IT ипотека</option>
<option>Военная ипотека</option>
<option>Рассрочка</option>
<option>Наличные</option>
<option>Стандартная ипотека</option>
<option>Не знает</option>
</select>
</div>
<div>
<label>Метка</label>
<select id="tag">
<option>Горячий</option>
<option>Тёплый</option>
<option>Холодный</option>
<option>Агент</option>
<option>Проблемный</option>
<option>Не работать</option>
<option>VIP</option>
</select>
</div>
<div>
<label>Следующее действие</label>
<select id="nextAction">
<option>Перезвонить</option>
<option>Отправить подборку</option>
<option>Встреча</option>
<option>Показ</option>
<option>Узнать решение</option>
<option>Другое</option>
</select>
</div>
<div>
<label>Дата напоминания</label>
<input type="date" id="reminderDate">
</div>
</div>

<label>Быстрая заметка</label>
<textarea id="note" rows="3" placeholder="Например: звонить после 18:00, решение принимает жена..."></textarea>

<label>История / комментарий</label>
<textarea id="historyText" rows="3" placeholder="Что было сделано по клиенту"></textarea>

<div class="actions">
<button onclick="saveClient()">Сохранить</button>
<button class="gray" onclick="addHistory()">+ Добавить историю</button>
<button class="danger" onclick="deleteClient()">Удалить</button>
<button class="gray" onclick="closeModal()">Закрыть</button>
</div>

<div class="history">
<h3>История клиента</h3>
<div id="historyList"></div>
</div>

</div>
</div>

<script>
const statuses = ["Новый лид","Связался","Подбор","Отправлены варианты","Показ","Бронь","Сделка","Потерян"];
let clients = JSON.parse(localStorage.getItem("crmClients") || "[]");
let currentId = null;

function saveStorage(){
localStorage.setItem("crmClients", JSON.stringify(clients));
}

function todayStr(offset=0){
const d = new Date();
d.setDate(d.getDate()+offset);
return d.toISOString().split("T")[0];
}

function render(){
const board = document.getElementById("board");
const q = document.getElementById("searchInput").value.toLowerCase();
board.innerHTML = "";

statuses.forEach(st=>{
const col = document.createElement("div");
col.className = "column";
col.innerHTML = `<h3>${st}</h3>`;

clients
.filter(c=>c.status===st)
.filter(c=>(c.name+c.phone).toLowerCase().includes(q))
.forEach(c=>{
const card = document.createElement("div");
card.className = "card";
card.onclick = ()=>openClient(c.id);
card.innerHTML = `
<b>${c.name || "Без имени"}</b><br>
<small>📞 ${c.phone || ""}</small><br>
🏠 ${c.requestType || ""}<br>
📍 ${c.district || ""}<br>
💰 ${c.budget || ""}<br>
<small>📅 ${c.nextAction || ""}: ${c.reminderDate || "нет даты"}</small><br>
<span class="tag">${c.tag || ""}</span>
<span class="tag">${c.source || ""}</span>
`;
col.appendChild(card);
});

board.appendChild(col);
});

updateStats();
}

function updateStats(){
const today = todayStr(0);
const tomorrow = todayStr(1);

document.getElementById("totalCount").innerText = clients.length;
document.getElementById("todayCount").innerText = clients.filter(c=>c.reminderDate===today).length;
document.getElementById("tomorrowCount").innerText = clients.filter(c=>c.reminderDate===tomorrow).length;
document.getElementById("overdueCount").innerText = clients.filter(c=>c.reminderDate && c.reminderDate<today && c.status!=="Сделка" && c.status!=="Потерян").length;
}

function openNewClient(){
currentId = null;
document.getElementById("modalTitle").innerText = "Новый клиент";
clearForm();
document.getElementById("clientModal").style.display = "flex";
renderHistory([]);
}

function openClient(id){
currentId = id;
const c = clients.find(x=>x.id===id);
document.getElementById("modalTitle").innerText = c.name || "Клиент";

["name","phone","source","sourceDetail","status","clientType","requestType","city","district","budget","firstPay","monthPay","dealType","tag","nextAction","reminderDate","note"].forEach(id=>{
document.getElementById(id).value = c[id] || "";
});

document.getElementById("historyText").value = "";
renderHistory(c.history || []);
document.getElementById("clientModal").style.display = "flex";
}

function clearForm(){
["name","phone","sourceDetail","budget","firstPay","monthPay","reminderDate","note","historyText"].forEach(id=>document.getElementById(id).value="");
document.getElementById("status").value="Новый лид";
document.getElementById("source").value="Звонок";
}

function collectForm(){
const obj = {};
["name","phone","source","sourceDetail","status","clientType","requestType","city","district","budget","firstPay","monthPay","dealType","tag","nextAction","reminderDate","note"].forEach(id=>{
obj[id]=document.getElementById(id).value;
});
return obj;
}

function saveClient(){
const data = collectForm();
const now = new Date().toLocaleString("ru-RU");

if(currentId){
const c = clients.find(x=>x.id===currentId);
Object.assign(c,data);
c.updatedAt = now;
c.history = c.history || [];
c.history.unshift({date:now,text:"Карточка обновлена"});
}else{
data.id = Date.now();
data.createdAt = now;
data.updatedAt = now;
data.history = [{date:now,text:"Клиент создан"}];

const firstHistory = document.getElementById("historyText").value.trim();
if(firstHistory){
data.history.unshift({date:now,text:firstHistory});
}

clients.unshift(data);
currentId = data.id;
}

saveStorage();
render();
openClient(currentId);
}

function addHistory(){
if(!currentId){saveClient(); return;}
const text = document.getElementById("historyText").value.trim();
if(!text) return alert("Напиши комментарий в поле истории");

const c = clients.find(x=>x.id===currentId);
const now = new Date().toLocaleString("ru-RU");
c.history = c.history || [];
c.history.unshift({date:now,text});
c.updatedAt = now;

document.getElementById("historyText").value="";
saveStorage();
renderHistory(c.history);
render();
}

function renderHistory(history){
const box = document.getElementById("historyList");
box.innerHTML = "";
if(!history.length){box.innerHTML="<small>Истории пока нет</small>";return;}

history.forEach(h=>{
box.innerHTML += `<div style="margin-bottom:10px;border-bottom:1px solid #334155;padding-bottom:8px">
<small>${h.date}</small><br>${h.text}
</div>`;
});
}

function deleteClient(){
if(!currentId) return closeModal();
if(!confirm("Удалить клиента?")) return;
clients = clients.filter(c=>c.id!==currentId);
saveStorage();
closeModal();
render();
}

function closeModal(){
document.getElementById("clientModal").style.display = "none";
}

render();
</script>

</body>
</html>
